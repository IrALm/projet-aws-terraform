<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="550" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#232f3e">Phase 2 : application et base de données découplées</text>

  <!-- Acteurs externes -->
  <rect x="20" y="140" width="150" height="60" rx="8" fill="#f2f2f2" stroke="#666"/>
  <text x="95" y="166" text-anchor="middle" fill="#222" font-weight="600">Utilisateurs</text>
  <text x="95" y="186" text-anchor="middle" fill="#444" font-size="12">navigateur, HTTP :80</text>

  <rect x="20" y="300" width="150" height="88" rx="8" fill="#f2f2f2" stroke="#666"/>
  <text x="95" y="324" text-anchor="middle" fill="#222" font-weight="600">Poste admin</text>
  <text x="95" y="343" text-anchor="middle" fill="#444" font-size="12">Terraform, AWS CLI</text>
  <text x="95" y="360" text-anchor="middle" fill="#444" font-size="12">migrate-data.sh</text>
  <text x="95" y="377" text-anchor="middle" fill="#444" font-size="12">SSH :22 (IP/32)</text>

  <rect x="20" y="470" width="150" height="70" rx="8" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/>
  <text x="95" y="496" text-anchor="middle" fill="#555" font-weight="600">VM phase 1</text>
  <text x="95" y="515" text-anchor="middle" fill="#666" font-size="12">MySQL local (source)</text>
  <text x="95" y="531" text-anchor="middle" fill="#666" font-size="12">mysqldump via SSH</text>

  <!-- Région -->
  <rect x="200" y="55" width="880" height="645" rx="6" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="215" y="77" fill="#232f3e" font-weight="600">AWS Cloud : région us-east-1</text>

  <!-- Services régionaux -->
  <rect x="870" y="90" width="190" height="70" rx="8" fill="#fde8e8" stroke="#dd344c" stroke-width="1.5"/>
  <text x="965" y="117" text-anchor="middle" fill="#a3172b" font-weight="600">Secrets Manager</text>
  <text x="965" y="137" text-anchor="middle" fill="#a3172b" font-size="12">Mydbsecret</text>
  <text x="965" y="152" text-anchor="middle" fill="#a3172b" font-size="11">user, password, host, db</text>

  <rect x="660" y="90" width="190" height="70" rx="8" fill="#fde8e8" stroke="#dd344c" stroke-width="1.5"/>
  <text x="755" y="117" text-anchor="middle" fill="#a3172b" font-weight="600">IAM</text>
  <text x="755" y="137" text-anchor="middle" fill="#a3172b" font-size="12">LabInstanceProfile</text>
  <text x="755" y="152" text-anchor="middle" fill="#a3172b" font-size="11">(LabRole, AWS Academy)</text>

  <!-- IGW -->
  <rect x="230" y="200" width="100" height="70" rx="8" fill="#8c4fff" stroke="#5a2db3"/>
  <text x="280" y="230" text-anchor="middle" fill="#fff" font-weight="600">Internet</text>
  <text x="280" y="249" text-anchor="middle" fill="#fff" font-weight="600">Gateway</text>

  <!-- VPC -->
  <rect x="280" y="180" width="780" height="500" rx="6" fill="#f3ecff" fill-opacity="0.3" stroke="#8c4fff" stroke-width="2"/>
  <text x="350" y="203" fill="#5a2db3" font-weight="600">VPC universite-exemple-p2-vpc : 10.0.0.0/16</text>

  <!-- AZ a -->
  <rect x="350" y="215" width="340" height="450" rx="6" fill="none" stroke="#147eba" stroke-dasharray="4 4"/>
  <text x="365" y="236" fill="#147eba" font-weight="600">Zone us-east-1a</text>
  <!-- AZ b -->
  <rect x="705" y="215" width="340" height="450" rx="6" fill="none" stroke="#147eba" stroke-dasharray="4 4"/>
  <text x="720" y="236" fill="#147eba" font-weight="600">Zone us-east-1b</text>

  <!-- Public a -->
  <rect x="365" y="248" width="310" height="200" rx="6" fill="#e9f5e1" stroke="#3f8624" stroke-width="1.5"/>
  <text x="378" y="268" fill="#2d6a1a" font-weight="600">Public : 10.0.1.0/24</text>
  <rect x="380" y="280" width="280" height="155" rx="6" fill="none" stroke="#d13212" stroke-dasharray="6 3"/>
  <text x="392" y="298" fill="#d13212" font-size="12" font-weight="600">SG web : 80 depuis 0.0.0.0/0, 22 depuis IP/32</text>
  <rect x="400" y="310" width="240" height="110" rx="8" fill="#fff4e5" stroke="#ed7100" stroke-width="2"/>
  <text x="520" y="335" text-anchor="middle" fill="#9a4a00" font-weight="600">EC2 app-server</text>
  <text x="520" y="355" text-anchor="middle" fill="#9a4a00" font-size="12">t3.micro, Ubuntu 24.04</text>
  <text x="520" y="373" text-anchor="middle" fill="#9a4a00" font-size="12">Node.js :80, IMDSv2</text>
  <text x="520" y="391" text-anchor="middle" fill="#9a4a00" font-size="12">profil IAM : LabInstanceProfile</text>
  <text x="520" y="409" text-anchor="middle" fill="#9a4a00" font-size="12">EBS gp3 chiffré</text>

  <!-- Public b -->
  <rect x="720" y="248" width="310" height="200" rx="6" fill="#e9f5e1" stroke="#3f8624" stroke-width="1.5"/>
  <text x="733" y="268" fill="#2d6a1a" font-weight="600">Public : 10.0.2.0/24</text>
  <text x="875" y="355" text-anchor="middle" fill="#2d6a1a" font-size="12" font-style="italic">réservé à la phase 3</text>
  <text x="875" y="373" text-anchor="middle" fill="#2d6a1a" font-size="12" font-style="italic">(ALB + Auto Scaling)</text>

  <!-- Private a -->
  <rect x="365" y="465" width="310" height="185" rx="6" fill="#e6f0fa" stroke="#2e73b8" stroke-width="1.5"/>
  <text x="378" y="485" fill="#1d4f80" font-weight="600">Privé : 10.0.11.0/24 (sans route Internet)</text>
  <rect x="380" y="497" width="280" height="140" rx="6" fill="none" stroke="#d13212" stroke-dasharray="6 3"/>
  <text x="392" y="515" fill="#d13212" font-size="12" font-weight="600">SG db : 3306 depuis le SG web uniquement</text>
  <rect x="400" y="527" width="240" height="95" rx="8" fill="#ffffff" stroke="#2e73b8" stroke-width="2"/>
  <text x="520" y="552" text-anchor="middle" fill="#1d4f80" font-weight="600">Amazon RDS MySQL 8.4</text>
  <text x="520" y="572" text-anchor="middle" fill="#1d4f80" font-size="12">db.t3.micro, mono-AZ</text>
  <text x="520" y="590" text-anchor="middle" fill="#1d4f80" font-size="12">base STUDENTS, gp3 chiffré</text>
  <text x="520" y="608" text-anchor="middle" fill="#1d4f80" font-size="12">publicly_accessible = false</text>

  <!-- Private b -->
  <rect x="720" y="465" width="310" height="185" rx="6" fill="#e6f0fa" stroke="#2e73b8" stroke-width="1.5"/>
  <text x="733" y="485" fill="#1d4f80" font-weight="600">Privé : 10.0.12.0/24</text>
  <text x="875" y="560" text-anchor="middle" fill="#1d4f80" font-size="12" font-style="italic">DB subnet group (2 zones exigées)</text>
  <text x="875" y="578" text-anchor="middle" fill="#1d4f80" font-size="12" font-style="italic">prêt pour un passage Multi-AZ</text>

  <!-- Flux -->
  <!-- Utilisateurs -> IGW -->
  <path d="M170,170 L215,170 L215,225 L228,225" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <!-- Admin -> IGW (SSH) -->
  <path d="M170,330 L215,330 L215,250 L228,250" fill="none" stroke="#333" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <!-- IGW -> EC2 -->
  <path d="M330,235 L345,235 L345,365 L398,365" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <!-- EC2 -> RDS -->
  <line x1="520" y1="420" x2="520" y2="525" stroke="#2e73b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="528" y="460" fill="#1d4f80" font-size="12" font-weight="600">MySQL :3306</text>
  <!-- EC2 -> Secrets Manager -->
  <path d="M640,330 L690,330 L690,175 L965,175 L965,162" fill="none" stroke="#dd344c" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="700" y="193" fill="#a3172b" font-size="12">GetSecretValue (HTTPS)</text>
  <!-- Phase1 -> admin (dump) -->
  <path d="M95,470 L95,390" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- Légende -->
  <line x1="215" y1="712" x2="250" y2="712" stroke="#333" stroke-width="1.8"/>
  <text x="256" y="716" fill="#333" font-size="12">HTTP public</text>
  <line x1="350" y1="712" x2="385" y2="712" stroke="#333" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="391" y="716" fill="#333" font-size="12">SSH admin</text>
  <line x1="480" y1="712" x2="515" y2="712" stroke="#2e73b8" stroke-width="2"/>
  <text x="521" y="716" fill="#333" font-size="12">Accès base (privé)</text>
  <line x1="650" y1="712" x2="685" y2="712" stroke="#dd344c" stroke-width="1.8"/>
  <text x="691" y="716" fill="#333" font-size="12">Lecture du secret</text>
  <line x1="820" y1="712" x2="855" y2="712" stroke="#999" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="861" y="716" fill="#333" font-size="12">Migration des données</text>
</svg>
