<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Fond explicite (lisible aussi en thème sombre) -->
  <rect width="960" height="560" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#232f3e">Phase 1 : application web sur une VM unique</text>

  <!-- Utilisateurs -->
  <rect x="30" y="150" width="150" height="60" rx="8" fill="#f2f2f2" stroke="#666"/>
  <text x="105" y="176" text-anchor="middle" fill="#222" font-weight="600">Utilisateurs</text>
  <text x="105" y="196" text-anchor="middle" fill="#444" font-size="12">navigateur, HTTP :80</text>

  <!-- Administrateur -->
  <rect x="30" y="330" width="150" height="60" rx="8" fill="#f2f2f2" stroke="#666"/>
  <text x="105" y="356" text-anchor="middle" fill="#222" font-weight="600">Administrateur</text>
  <text x="105" y="376" text-anchor="middle" fill="#444" font-size="12">SSH :22 depuis IP/32</text>

  <!-- Région AWS -->
  <rect x="220" y="60" width="710" height="470" rx="6" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="235" y="82" fill="#232f3e" font-weight="600">AWS Cloud : région us-east-1</text>

  <!-- Internet Gateway (sur la bordure du VPC) -->
  <rect x="250" y="230" width="100" height="70" rx="8" fill="#8c4fff" stroke="#5a2db3"/>
  <text x="300" y="260" text-anchor="middle" fill="#fff" font-weight="600">Internet</text>
  <text x="300" y="279" text-anchor="middle" fill="#fff" font-weight="600">Gateway</text>

  <!-- VPC -->
  <rect x="300" y="100" width="610" height="410" rx="6" fill="#f3ecff" fill-opacity="0.35" stroke="#8c4fff" stroke-width="2"/>
  <text x="380" y="124" fill="#5a2db3" font-weight="600">VPC universite-exemple-vpc : 10.0.0.0/16</text>

  <!-- Zone de disponibilité -->
  <rect x="380" y="140" width="510" height="350" rx="6" fill="none" stroke="#147eba" stroke-dasharray="4 4"/>
  <text x="395" y="162" fill="#147eba" font-weight="600">Zone de disponibilité us-east-1a</text>

  <!-- Sous-réseau public -->
  <rect x="400" y="175" width="470" height="295" rx="6" fill="#e9f5e1" stroke="#3f8624" stroke-width="1.5"/>
  <text x="415" y="197" fill="#2d6a1a" font-weight="600">Sous-réseau public : 10.0.1.0/24</text>
  <text x="415" y="215" fill="#2d6a1a" font-size="12">Table de routage : 0.0.0.0/0 → Internet Gateway</text>

  <!-- Security group -->
  <rect x="430" y="235" width="420" height="215" rx="6" fill="none" stroke="#d13212" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="445" y="255" fill="#d13212" font-weight="600">Security group universite-exemple-app-sg</text>
  <text x="445" y="272" fill="#d13212" font-size="12">Entrée : 80 depuis 0.0.0.0/0 · 22 depuis IP/32 · 3306 fermé</text>

  <!-- Instance EC2 -->
  <rect x="460" y="290" width="360" height="140" rx="8" fill="#fff4e5" stroke="#ed7100" stroke-width="2"/>
  <text x="640" y="314" text-anchor="middle" fill="#9a4a00" font-weight="600">EC2 universite-exemple-app-vm</text>
  <text x="640" y="332" text-anchor="middle" fill="#9a4a00" font-size="12">t3.small · Ubuntu 24.04 · gp3 20 Go · IP publique</text>

  <rect x="480" y="350" width="150" height="60" rx="6" fill="#ffffff" stroke="#ed7100"/>
  <text x="555" y="375" text-anchor="middle" fill="#222" font-weight="600">App Node.js</text>
  <text x="555" y="394" text-anchor="middle" fill="#444" font-size="12">port 80</text>

  <rect x="650" y="350" width="150" height="60" rx="6" fill="#ffffff" stroke="#2e73b8"/>
  <text x="725" y="375" text-anchor="middle" fill="#222" font-weight="600">MySQL local</text>
  <text x="725" y="394" text-anchor="middle" fill="#444" font-size="12">base STUDENTS :3306</text>

  <line x1="630" y1="380" x2="648" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Flux -->
  <path d="M180,180 L240,180 L240,255 L248,255" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M180,360 L240,360 L240,280 L248,280" fill="none" stroke="#333" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <path d="M350,265 L415,265 L415,380 L478,380" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Légende -->
  <line x1="240" y1="545" x2="280" y2="545" stroke="#333" stroke-width="1.8"/>
  <text x="288" y="549" fill="#333" font-size="12">HTTP (public)</text>
  <line x1="400" y1="545" x2="440" y2="545" stroke="#333" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="448" y="549" fill="#333" font-size="12">SSH (IP admin uniquement)</text>
  <text x="640" y="549" fill="#333" font-size="12">Le code de l'app est installé par user_data</text>
</svg>
