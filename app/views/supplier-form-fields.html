<div class="form-grid">
    <div class="form-group span-2">
        <label for="name">Name</label>
        <input value="{{supplier.name}}" type="text" class="input" id="name" name="name" aria-describedby="nameHelp" placeholder="Full name">
        <small id="nameHelp" class="form-text">Name of this student</small>
    </div>
    <div class="form-group span-2">
        <label for="address">Address</label>
        <input value="{{supplier.address}}" type="text" class="input" id="address" name="address" aria-describedby="addressHelp" placeholder="Street and number">
        <small id="addressHelp" class="form-text">Address for this student</small>
    </div>
    <div class="form-group">
        <label for="city">City</label>
        <input value="{{supplier.city}}" type="text" class="input" id="city" name="city" aria-describedby="cityHelp" placeholder="City">
        <small id="cityHelp" class="form-text">City for this student</small>
    </div>
    <div class="form-group">
        <label for="state">State</label>
        <input value="{{supplier.state}}" type="text" class="input" id="state" name="state" aria-describedby="stateHelp" placeholder="State or region">
        <small id="stateHelp" class="form-text">State for this student</small>
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input value="{{supplier.email}}" type="email" class="input" id="email" name="email" aria-describedby="emailHelp" placeholder="name@example.edu">
        <small id="emailHelp" class="form-text">Email for this student</small>
    </div>
    <div class="form-group">
        <label for="phone">Phone</label>
        <input value="{{supplier.phone}}" type="text" class="input" id="phone" name="phone" aria-describedby="phoneHelp" placeholder="10 digits">
        <small id="phoneHelp" class="form-text">Phone number for this student</small>
    </div>
</div>
