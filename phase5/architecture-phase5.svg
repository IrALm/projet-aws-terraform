<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1180" height="640" fill="#ffffff"/>
  <text x="590" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#232f3e">Phase 5 : chaîne CI/CD (GitHub Actions → Amazon ECR → Auto Scaling)</text>

  <!-- Développeur -->
  <rect x="20" y="110" width="140" height="70" rx="8" fill="#f2f2f2" stroke="#666"/>
  <text x="90" y="138" text-anchor="middle" fill="#222" font-weight="600">Développeur</text>
  <text x="90" y="158" text-anchor="middle" fill="#444" font-size="12">git push main / PR</text>

  <!-- GitHub -->
  <rect x="190" y="60" width="970" height="250" rx="8" fill="#f6f8fa" stroke="#24292f" stroke-width="1.5"/>
  <text x="205" y="82" fill="#24292f" font-weight="600">GitHub : dépôt IrALm/projet-aws-terraform · workflow .github/workflows/ci-cd.yml</text>
  <text x="205" y="100" fill="#57606a" font-size="12">Secrets : AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN (identifiants du lab, sync-lab-credentials.sh)</text>

  <!-- Jobs -->
  <rect x="210" y="125" width="150" height="90" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="285" y="148" text-anchor="middle" fill="#0550ae" font-weight="600">1. Build</text>
  <text x="285" y="167" text-anchor="middle" fill="#0550ae" font-size="12">npm ci</text>
  <text x="285" y="183" text-anchor="middle" fill="#0550ae" font-size="12">node --check</text>
  <text x="285" y="199" text-anchor="middle" fill="#0550ae" font-size="12">docker build</text>

  <rect x="385" y="115" width="175" height="78" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="472" y="136" text-anchor="middle" fill="#0550ae" font-weight="600">2a. Analyse statique</text>
  <text x="472" y="154" text-anchor="middle" fill="#0550ae" font-size="12">hadolint, shellcheck</text>
  <text x="472" y="170" text-anchor="middle" fill="#0550ae" font-size="12">terraform fmt/validate</text>
  <text x="472" y="186" text-anchor="middle" fill="#0550ae" font-size="12">npm audit (informatif)</text>

  <rect x="385" y="203" width="175" height="78" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="472" y="224" text-anchor="middle" fill="#0550ae" font-weight="600">2b. Tests fonctionnels</text>
  <text x="472" y="242" text-anchor="middle" fill="#0550ae" font-size="12">docker compose</text>
  <text x="472" y="258" text-anchor="middle" fill="#0550ae" font-size="12">(app + MySQL)</text>
  <text x="472" y="274" text-anchor="middle" fill="#0550ae" font-size="12">test-app.sh : CRUD</text>

  <rect x="585" y="125" width="160" height="90" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="665" y="148" text-anchor="middle" fill="#7d4e00" font-weight="600">3. Packaging/push</text>
  <text x="665" y="167" text-anchor="middle" fill="#7d4e00" font-size="12">tag = SHA du commit</text>
  <text x="665" y="183" text-anchor="middle" fill="#7d4e00" font-size="12">docker push → ECR</text>
  <text x="665" y="199" text-anchor="middle" fill="#7d4e00" font-size="12">(main uniquement)</text>

  <rect x="770" y="125" width="160" height="90" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="850" y="148" text-anchor="middle" fill="#7d4e00" font-weight="600">4. Test de charge</text>
  <text x="850" y="167" text-anchor="middle" fill="#7d4e00" font-size="12">image tirée d'ECR</text>
  <text x="850" y="183" text-anchor="middle" fill="#7d4e00" font-size="12">loadtest 200 req/s</text>
  <text x="850" y="199" text-anchor="middle" fill="#7d4e00" font-size="12">erreurs ≤ 0,5 %, p95 ≤ 500 ms</text>

  <rect x="955" y="125" width="190" height="90" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="1050" y="148" text-anchor="middle" fill="#116329" font-weight="600">5. Déploiement prod</text>
  <text x="1050" y="167" text-anchor="middle" fill="#116329" font-size="12">promotion sha → latest</text>
  <text x="1050" y="183" text-anchor="middle" fill="#116329" font-size="12">remplacement progressif</text>
  <text x="1050" y="199" text-anchor="middle" fill="#116329" font-size="12">test-app.sh sur l'ALB</text>

  <!-- Flèches jobs -->
  <path d="M160,145 L208,145" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M360,160 L383,155" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M360,185 L383,240" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M560,155 L583,165" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M560,240 L583,180" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M745,170 L768,170" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M930,170 L953,170" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>

  <text x="590" y="250" fill="#57606a" font-size="12">Pull request : étapes 1 et 2 seulement (aucun accès AWS)</text>
  <text x="590" y="268" fill="#57606a" font-size="12">Chaque étape bloque la suivante en cas d'échec</text>
  <text x="590" y="286" fill="#57606a" font-size="12">« latest » n'est promu qu'après le test de charge réussi</text>

  <!-- AWS -->
  <rect x="190" y="340" width="970" height="280" rx="6" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="205" y="362" fill="#232f3e" font-weight="600">AWS Cloud : us-east-1 (environnement de production = infrastructure de la phase 4)</text>

  <rect x="560" y="385" width="220" height="80" rx="8" fill="#fff4e5" stroke="#ed7100" stroke-width="1.5"/>
  <text x="670" y="410" text-anchor="middle" fill="#9a4a00" font-weight="600">Amazon ECR</text>
  <text x="670" y="430" text-anchor="middle" fill="#9a4a00" font-size="12">universite-exemple-app</text>
  <text x="670" y="447" text-anchor="middle" fill="#9a4a00" font-size="12">:&lt;sha&gt; (chaque build) · :latest (prod)</text>

  <rect x="860" y="385" width="280" height="215" rx="8" fill="none" stroke="#ed7100" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="875" y="406" fill="#9a4a00" font-weight="600">Auto Scaling universite-exemple-p4-asg</text>
  <rect x="880" y="420" width="115" height="60" rx="6" fill="#fff4e5" stroke="#ed7100"/>
  <text x="937" y="446" text-anchor="middle" fill="#9a4a00" font-size="12">EC2 + Docker</text>
  <text x="937" y="463" text-anchor="middle" fill="#9a4a00" font-size="12">ancienne image</text>
  <rect x="1010" y="420" width="115" height="60" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="1067" y="446" text-anchor="middle" fill="#116329" font-size="12">EC2 + Docker</text>
  <text x="1067" y="463" text-anchor="middle" fill="#116329" font-size="12">nouvelle image</text>
  <path d="M995,450 L1008,450" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="1000" y="505" text-anchor="middle" fill="#9a4a00" font-size="12">Les nouvelles instances sont saines</text>
  <text x="1000" y="521" text-anchor="middle" fill="#9a4a00" font-size="12">AVANT le retrait des anciennes :</text>
  <text x="1000" y="537" text-anchor="middle" fill="#9a4a00" font-size="12">aucune baisse de capacité</text>
  <text x="1000" y="575" text-anchor="middle" fill="#9a4a00" font-size="12">docker pull :latest au démarrage</text>

  <rect x="230" y="385" width="250" height="80" rx="8" fill="#8c4fff" stroke="#5a2db3"/>
  <text x="355" y="412" text-anchor="middle" fill="#fff" font-weight="600">Application Load Balancer</text>
  <text x="355" y="432" text-anchor="middle" fill="#fff" font-size="12">universite-exemple-p4-alb</text>
  <text x="355" y="450" text-anchor="middle" fill="#fff" font-size="12">test de production après déploiement</text>

  <rect x="230" y="500" width="250" height="70" rx="8" fill="#ffffff" stroke="#2e73b8" stroke-width="1.5"/>
  <text x="355" y="527" text-anchor="middle" fill="#1d4f80" font-weight="600">RDS MySQL + Secrets Manager</text>
  <text x="355" y="546" text-anchor="middle" fill="#1d4f80" font-size="12">inchangés par le pipeline</text>

  <!-- Flux AWS -->
  <path d="M665,215 L665,383" fill="none" stroke="#9a6700" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="672" y="300" fill="#7d4e00" font-size="12">push :&lt;sha&gt;</text>
  <path d="M850,215 L850,330 L700,330 L700,383" fill="none" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="760" y="325" fill="#7d4e00" font-size="12">pull :&lt;sha&gt;</text>
  <path d="M1050,215 L1050,383" fill="none" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="1056" y="300" fill="#116329" font-size="12">set-desired-capacity + terminate (anciennes)</text>
  <path d="M780,425 L858,425" fill="none" stroke="#ed7100" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <path d="M480,425 L558,425" fill="none" stroke="none"/>
  <path d="M1000,215 L1000,318 L355,318 L355,383" fill="none" stroke="#1a7f37" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="380" y="372" fill="#116329" font-size="11">test-app.sh</text>
</svg>
